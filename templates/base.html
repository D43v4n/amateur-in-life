<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firewall Rule Approver</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .badge-pending   { background-color: #ffc107; color: #000; }
    .badge-approved  { background-color: #198754; color: #fff; }
    .badge-rejected  { background-color: #dc3545; color: #fff; }
    .suggestion-chip {
      display: inline-block;
      cursor: pointer;
      font-size: .78rem;
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid #0d6efd;
      color: #0d6efd;
      margin: 2px;
      transition: all .15s;
    }
    .suggestion-chip:hover { background-color: #0d6efd; color: #fff; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-shield-lock-fill me-2"></i>Firewall Rule Approver</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
        <i class="bi bi-plus-circle me-1"></i>New Request
      </a>
      <a class="nav-link {% if request.path == '/rules' %}active{% endif %}" href="/rules">
        <i class="bi bi-list-ul me-1"></i>Requests
      </a>
    </div>
  </div>
</nav>

<div class="container mt-4 mb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
      <i class="bi bi-{% if category == 'success' %}check-circle{% elif category == 'warning' %}exclamation-triangle{% else %}x-circle{% endif %} me-2"></i>
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
